# DukaanFlow in Docker (production build): PostgreSQL + API + web app.
#   1. cp backend/.env.production.example backend/.env.production   (fill in the keys)
#   2. docker compose up -d --build
#   3. open http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dukaanflow
      POSTGRES_USER: dukaanflow
      POSTGRES_PASSWORD: dukaanflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dukaanflow -d dukaanflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Runs the database migrations, then starts the API (internal port 8000).
  api:
    build: ./backend
    env_file: backend/.env.production
    environment:
      DATABASE_URL: postgresql+psycopg://dukaanflow:dukaanflow@db:5432/dukaanflow
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # The React app (nginx); /api/... is passed to the api container.
  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
