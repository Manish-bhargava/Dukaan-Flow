[pytest]
# Only the backend test suite; standalone scripts (e.g. sms_test/) are not tests.
testpaths = tests
# DeepEval's pytest plugin would load backend/.env into the environment at start-up (real keys
# and secrets in tests); DeepEval is used as a library in tests/test_ai_matching_eval.py instead.
addopts = -p no:deepeval
